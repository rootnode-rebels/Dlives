# JVM Heap Size & Garbage Collection Optimization
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Kotlin & KSP Compiler Daemon Memory
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.incremental=true
ksp.incremental=true

# Gradle Build Speed & Caching
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX Settings
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

